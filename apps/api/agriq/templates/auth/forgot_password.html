{% extends "base.html" %}
{% block content %}
<div class="center-page">
    <div class="login-box glass slide-up">
        <div class="brand-mark">🌾</div>
        <div class="login-logo AGRIQ-glow">AGRIQ AI</div>
        <p class="subtitle">Recover access to your AGRIQ AI account.</p>
        {% if error %}
        <p class="subtitle" style="color:#991b1b" role="alert" data-error-code="{{ error_code or '' }}">{{ error }}</p>
        {% endif %}
        {% if notice %}
        <p class="subtitle" style="color:{{ '#166534' if ok else '#92400e' }}" role="status" data-status-code="{{ status_code or '' }}">{{ notice }}</p>
        {% endif %}
        <form method="POST" action="/forgot-password">
            <input type="hidden" name="csrf_token" value="{{ csrf_token or '' }}">
            <label for="recovery-contact">Email or Phone Number</label>
            <input type="text" id="recovery-contact" name="user_contact"
                   placeholder="Enter the email or phone on your account" required inputmode="email"
                   value="{{ user_contact or '' }}">
            <button type="submit">Send Reset Link</button>
        </form>
        <p class="subtitle" style="margin-top:10px"><a class="link-button" href="/login">Back to sign in</a></p>
    </div>
</div>
{% endblock %}
