{% extends "base.html" %}
{% block content %}
<div class="center-page">
    <div class="login-box glass slide-up">
        <div class="brand-mark">🌾</div>
        <div class="login-logo AGRIQ-glow">AGRIQ AI</div>
        <p class="subtitle">Choose a new password.</p>
        {% if error %}
        <p class="subtitle" style="color:#991b1b" role="alert" data-error-code="{{ error_code or '' }}">{{ error }}</p>
        {% endif %}
        {% if notice %}
        <p class="subtitle" style="color:#166534" role="status" data-status-code="{{ status_code or '' }}">{{ notice }}</p>
        {% endif %}
        {% if token and not notice %}
        <form method="POST" action="/reset-password">
            <input type="hidden" name="csrf_token" value="{{ csrf_token or '' }}">
            <input type="hidden" name="token" value="{{ token }}">
            <label for="new-password">New Password</label>
            <input type="password" id="new-password" name="password" placeholder="At least 8 characters"
                   minlength="8" required autocomplete="new-password">
            <label for="new-password-confirm">Confirm New Password</label>
            <input type="password" id="new-password-confirm" name="password_confirm"
                   placeholder="Repeat the new password" minlength="8" required autocomplete="new-password">
            <button type="submit">Set New Password</button>
        </form>
        {% endif %}
        <p class="subtitle" style="margin-top:10px"><a class="link-button" href="/login">Back to sign in</a></p>
    </div>
</div>
{% endblock %}
