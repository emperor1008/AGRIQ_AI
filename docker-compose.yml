# Root convenience wrapper: full production topology lives in
# infrastructure/docker/docker-compose.yml. This file gives developers a
# one-command local stack (API only, SQLite + in-memory limiter).
services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      AGRIQ_ENV: development
      AGRIQ_SECRET_KEY: ${AGRIQ_SECRET_KEY:-local-dev-secret-change-me}
      FLASK_DEBUG: "0"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "8000:8000"
    restart: unless-stopped
