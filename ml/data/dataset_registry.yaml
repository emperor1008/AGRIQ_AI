# AGRIQ AI dataset registry (Phase 4).
#
# Real-data policy: every entry must record a verifiable original source,
# licence and checksum. A dataset may be used for training ONLY with
# status: approved (licence verified + quality reviewed by a named reviewer).
#
# Allowed status values:
#   discovered | licence_review_required | quality_review_required
#   | approved | rejected | archived
#
# NOTE: entries below are *discovery records* with real, cited public sources.
# No images have been downloaded, no checksums computed and no licence review
# completed in this build — so every entry stays at `discovered` /
# `licence_review_required` and checksum/downloaded fields remain null.
# Fabricating checksums or counts is forbidden.

datasets:

  - dataset_id: plantvillage
    dataset_name: PlantVillage (subset relevant to rice & tomato)
    original_source_url: "https://github.com/spMohanty/PlantVillage-Dataset"
    original_authors: "Sharada P. Mohanty, David Hughes, Marcel Salathé"
    associated_paper: "Using Deep Learning for Image-Based Plant Disease Detection (Frontiers in Plant Science, 2016)"
    licence: "Open research dataset; attribution required — verification of current hosting terms pending"
    licence_verified: false
    permitted_use: "Research; commercial-use terms to be confirmed before approval"
    crop: ["rice", "tomato"]
    original_classes: ["rice_blast", "rice_brown_spot", "rice_bacterial_leaf_blight", "rice_tungro", "tomato_early_blight", "tomato_late_blight", "tomato_leaf_mould", "tomato_healthy", "rice_healthy"]
    selected_classes: []          # filled only after label mapping review
    original_image_count: null    # computed at download, never estimated
    accepted_image_count: null
    rejected_image_count: null
    checksum: null                # sha256 of the downloaded archive, recorded by ml.data.download
    downloaded_at: null
    reviewed_at: null
    reviewer: null
    geographic_origin: "Controlled-background laboratory photographs (multi-country)"
    capture_conditions: "Controlled single-leaf scans/photos, plain background; NOT representative of field photographs alone"
    known_limitations:
      - "Controlled images cannot alone prove field performance"
      - "Class balance skewed; some classes very large"
      - "Known label-noise reports for a minority of images"
    split_strategy: "pending — will use grouped split by original image family"
    status: discovered

