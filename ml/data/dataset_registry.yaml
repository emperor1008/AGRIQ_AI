    licence: "To be verified (paper states open release); NOT yet verified"
    licence_verified: false
    permitted_use: "Research; to be confirmed"
    crop: ["tomato", "rice"]
    original_classes: ["tomato_early_blight", "tomato_late_blight", "tomato_leaf_mould", "tomato_healthy"]
    selected_classes: []
    original_image_count: null
    accepted_image_count: null
    rejected_image_count: null
    checksum: null
    downloaded_at: null
    reviewed_at: null
    reviewer: null
    geographic_origin: "Field photographs, web-sourced (global)"
