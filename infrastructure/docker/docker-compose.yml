services:
  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    environment:
      AGRIQ_ENV: production
      AGRIQ_SECRET_KEY: ${AGRIQ_SECRET_KEY:?set a long random secret}
      AGRIQ_COOKIE_SECURE: "1"
      AGRIQ_ENABLE_HSTS: "1"
      DATABASE_URL: postgresql://agriq:${POSTGRES_PASSWORD:?set a password}@postgres:5432/agriq
      RATELIMIT_STORAGE_URI: redis://redis:6379/0
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      DATA_GOV_IN_API_KEY: ${DATA_GOV_IN_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agriq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a password}
      POSTGRES_DB: agriq
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agriq"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../../apps/web/static:/var/www/agriq/static:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
