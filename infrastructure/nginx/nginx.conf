server {
    listen 80;
    server_name _;

    # Terminate TLS at your load balancer or add a 443 server block with
    # certificates; HSTS is enabled in the app when AGRIQ_ENABLE_HSTS=1.

    client_max_body_size 6m;  # 5 MiB uploads + overhead

    # Static assets served directly from the web app volume
    location /static/ {
        alias /var/www/agriq/static/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        add_header X-Content-Type-Options nosniff;
    }

    location / {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /healthz {
        proxy_pass http://api:8000/healthz;
        access_log off;
    }
}
